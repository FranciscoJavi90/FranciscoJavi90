name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://trophy.ryotarofr.com/?username=FranciscoJavi90&theme=tokyonight&no-frame=true&no-bg=true" \
            "https://github-trophies.vercel.app/?username=FranciscoJavi90&theme=tokyonight&no-frame=true&no-bg=true" \
            "https://github-profile-trophy-tawny.vercel.app/?username=FranciscoJavi90&theme=tokyonight" \
            "https://github-profile-trophy-screw-hand.vercel.app/?username=FranciscoJavi90&theme=tokyonight" \
            "https://github-profile-trophy-kannan.vercel.app/?username=FranciscoJavi90&theme=tokyonight" \
            "https://github-readme-activity-graph.cyclic.app/graph?username=FranciscoJavi90" \
            "https://github-readme-activity-graph.onrender.com/graph?username=FranciscoJavi90" \
            "https://ghchart.rshah.org/7AA2F7/FranciscoJavi90" \
            "https://github-readme-stats-sigma-five.vercel.app/api?username=FranciscoJavi90" \
            ; do
            echo "=== $u"; curl -s -m 25 -o out -w 'HTTP %{http_code} %{content_type} %{size_download}B\n' "$u"; head -c 400 out | tr '\n' ' '; echo; done
