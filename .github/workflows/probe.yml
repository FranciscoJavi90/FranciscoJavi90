name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://github-profile-trophy.vercel.app/?username=FranciscoJavi90&theme=tokyonight&no-frame=true&no-bg=true" \
            "https://github-readme-stats.vercel.app/api?username=FranciscoJavi90&theme=tokyonight" \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=FranciscoJavi90&layout=compact" \
            "https://streak-stats.demolab.com?user=FranciscoJavi90&theme=tokyonight" \
            "https://github-readme-activity-graph.vercel.app/graph?username=FranciscoJavi90&theme=tokyo-night" \
            "https://quotes-github-readme.vercel.app/api?type=horizontal&theme=tokyonight" \
            "https://capsule-render.vercel.app/api?type=waving&height=120&section=footer" \
            "https://readme-typing-svg.demolab.com?lines=Hola" ; do
            echo "=== $u"; curl -s -m 25 -o out -w 'HTTP %{http_code} %{content_type} %{size_download}B\n' "$u"; head -c 400 out | tr '\n' ' '; echo; done
