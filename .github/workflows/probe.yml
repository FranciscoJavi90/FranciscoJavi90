name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=FranciscoJavi90&theme=tokyonight" \
            "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=FranciscoJavi90&theme=tokyonight" \
            "https://github-profile-summary-cards.vercel.app/api/cards/productive-time?username=FranciscoJavi90&theme=tokyonight&utcOffset=-6" \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=FranciscoJavi90&layout=donut&theme=tokyonight" \
            ; do
            echo "=== $u"; curl -s -m 25 -o out -w 'HTTP %{http_code} %{content_type} %{size_download}B\n' "$u" || true; touch out; head -c 300 out | tr '\n' ' '; echo; done
